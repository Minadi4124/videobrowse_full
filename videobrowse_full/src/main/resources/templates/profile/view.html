<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,"/>
  <style>
    .profile-card{max-width:900px;margin:24px auto}
    h5{color:#ffffff !important}
  </style>
  </head>
<body class="bg-light">

<div class="container profile-card">
  <div class="d-flex align-items-center mb-2">
    <a href="/" class="btn btn-outline-light btn-sm">&larr; Back to Home</a>
  </div>
  <div class="card">
    <div class="card-body">
      <h3 class="mb-3">My Profile</h3>
      <div class="mb-3">
        <p class="mb-1"><strong>Display Name:</strong></p>
        <div class="d-flex align-items-center">
          <form class="d-flex w-100" method="post" th:action="@{/profile/display-name}">
            <input class="form-control me-2" type="text" name="displayName" th:value="${profile.displayName}"/>
            <button class="btn btn-primary" type="submit">Update</button>
          </form>
        </div>
      </div>

      <div class="mb-3">
        <h5>Preferences (JSON)</h5>
        <form method="post" th:action="@{/profile/preferences}">
          <textarea class="form-control" name="preferencesJson" rows="6" th:text="${profile.preferencesJson}"></textarea>
          <div class="mt-2 d-flex">
            <button class="btn btn-outline-secondary ms-auto" type="submit">Save Preferences</button>
          </div>
        </form>
      </div>

      <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm" th:href="@{/profile/watch-history}">Watch History</a>
        <a class="btn btn-outline-primary btn-sm ms-2" th:href="@{/profile/search-history}">Search History</a>
        <a class="btn btn-outline-primary btn-sm ms-2" th:href="@{/profile/my-uploads}">My Uploads</a>
      </div>

      <div>
        <h5>Recommended for You</h5>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
          <div class="col" th:each="v : ${recommendations}">
            <div class="card h-100">
              <div class="card-body">
                <h6 class="card-title" th:text="${v.title}">Title</h6>
                <a class="btn btn-sm btn-primary" th:href="@{'/videos/' + ${v.id}}">Open</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
