<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>My Uploads</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="icon" href="data:,"/>
  <style>
    .profile-card{max-width:900px;margin:24px auto}
    .uv-card{width:100%;height:min-content;transition:all .3s;position:relative;border-radius:.5rem 2rem;box-shadow:0 15px 20px -5px rgba(0,0,0,.5);background:transparent;border:0}
    .uv-card:hover{transform:scale(1.03)}
    .uv-img{transition:all .3s;width:100%;height:100%;object-fit:cover}
    .uv-img-container{display:grid;border-radius:.5rem 2rem;height:220px;overflow:hidden;background:linear-gradient(135deg, rgba(0,229,255,.35), rgba(122,92,255,.35))}
    .uv-img:hover{transform:scale(1.15)}
    .uv-desc{position:absolute;bottom:.5rem;left:.5rem;text-align:start;padding:.5rem 1rem;width:60%;transition:all .5s ease;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(.1rem);background-color:rgba(0,229,255,.18);border-radius:.5rem 2rem}
    .uv-title{color:#ffffff;margin:0;font-weight:600;font-size:.85rem;line-height:1.2}
  </style>
</head>
<body class="bg-light">
  <div class="container profile-card">
    <div class="d-flex align-items-center mb-2">
      <a href="/profile" class="btn btn-outline-light btn-sm">&larr; Back to Profile</a>
      <h4 class="ms-3 mb-0">My Uploads</h4>
    </div>

    <div class="card">
      <div class="card-body">
        <div th:if="${#lists.isEmpty(videos)}" class="alert alert-info">
          You haven't uploaded any videos yet. <a href="/videos/upload" class="alert-link">Upload your first video</a>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" th:if="${!#lists.isEmpty(videos)}">
          <div class="col" th:each="video: ${videos}">
            <div class="uv-card mb-3">
              <div class="uv-img-container">
                <img class="uv-img" th:if="${video.thumbnail}" th:src="@{'/files/thumbs/' + ${video.thumbnail}}" alt="thumb"/>
              </div>
              <div class="uv-desc">
                <h6 class="uv-title" th:text="${video.title}">Title</h6>
              </div>
              <div class="p-3 d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                  <div class="small text-muted" th:text="${video.category}">Category</div>
                  <div class="small text-muted" th:text="${video.visibility}">Visibility</div>
                </div>
                <div class="d-flex flex-column gap-1 ms-3">
                  <a th:href="@{'/videos/' + ${video.id}}" class="btn btn-sm btn-primary">View</a>
                  <a th:href="@{'/videos/' + ${video.id} + '/edit'}" class="btn btn-sm btn-outline-secondary">Edit</a>
                  <form th:action="@{'/videos/' + ${video.id} + '/delete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger w-100" onclick="return confirm('Are you sure you want to delete this video?')">Delete</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
