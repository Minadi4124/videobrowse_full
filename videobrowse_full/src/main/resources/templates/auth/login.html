<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>SLIITFLIX - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="/css/theme.css" rel="stylesheet"/></head>
<body class="bg-light">
<div class="container mt-5" style="max-width:420px;">
  <h3>Login</h3>
  <form method="post" th:action="${redirect} != null ? '/login?redirect=' + ${redirect} : '/login'">
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username"/></div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" class="form-control" name="password"/>
        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">Show</button>
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
      <label class="form-check-label" for="rememberMe">Remember me</label>
    </div>
    <input type="hidden" name="redirect" th:value="${redirect}"/>
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <div class="mt-3">
    <a href="/register">Create an account</a>
  </div>
</div>
<script>
  (function(){
    const btn = document.getElementById('togglePassword');
    if (!btn) return;
    btn.addEventListener('click', function(){
      const input = document.querySelector('input[name="password"]');
      if (!input) return;
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      this.textContent = isHidden ? 'Hide' : 'Show';
      this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  })();
</script>
</body>
</html>
