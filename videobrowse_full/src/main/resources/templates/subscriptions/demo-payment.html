<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Demo Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <style>
    .card-input {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .form-control.is-invalid {
      border-color: #dc3545;
    }
  </style>
</head>
<body class="container py-5">
  <h2 class="mb-3">Demo Payment</h2>
  <div class="alert alert-info">This is a demo payment page. No real transaction occurs.</div>
  <form class="card p-3" th:action="@{/subscriptions}" method="get" id="paymentForm" novalidate>
    <div class="mb-3">
      <label class="form-label">Selected Plan</label>
      <input class="form-control" th:value="${plan}" readonly/>
    </div>
    
    <div class="mb-3">
      <label class="form-label">Card Number <span class="text-danger">*</span></label>
      <input type="text" 
             id="cardNumber" 
             name="cardNumber" 
             class="form-control card-input" 
             placeholder="1111 1111 1111 1111"
             maxlength="19"
             required/>
      <div class="invalid-feedback d-none" id="cardNumberError">Please enter a valid 16-digit card number</div>
    </div>
    
    <div class="row">
      <div class="col">
        <label class="form-label">Expiry Date <span class="text-danger">*</span></label>
        <input type="text" 
               id="expiryDate" 
               name="expiryDate" 
               class="form-control card-input" 
               placeholder="MM/YY"
               maxlength="5"
               required/>
        <div class="invalid-feedback d-none" id="expiryError">Please enter a valid expiry date (MM/YY)</div>
      </div>
      <div class="col">
        <label class="form-label">CVC <span class="text-danger">*</span></label>
        <input type="text" 
               id="cvc" 
               name="cvc" 
               class="form-control card-input" 
               placeholder="123"
               maxlength="3"
               required/>
        <div class="invalid-feedback d-none" id="cvcError">Please enter a valid 3-digit CVC</div>
      </div>
    </div>
    
    <button type="submit" class="btn btn-success mt-3">Simulate Pay</button>
    <a class="btn btn-link mt-3" href="/subscriptions/plans">Back</a>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const cardNumberInput = document.getElementById('cardNumber');
      const expiryInput = document.getElementById('expiryDate');
      const cvcInput = document.getElementById('cvc');
      const form = document.getElementById('paymentForm');

      // Card Number Formatting and Validation
      cardNumberInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
        if (value.length > 16) value = value.substring(0, 16);
        
        // Format with spaces every 4 digits
        let formatted = value.replace(/(\d{4})(?=\d)/g, '$1 ');
        e.target.value = formatted;
        
        // Validate
        validateCardNumber();
      });

      // Expiry Date Formatting and Validation
      expiryInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
        if (value.length > 4) value = value.substring(0, 4);
        
        // Format as MM/YY
        if (value.length >= 2) {
          value = value.substring(0, 2) + '/' + value.substring(2);
        }
        e.target.value = value;
        
        // Validate
        validateExpiryDate();
      });

      // CVC Input - Only Numbers
      cvcInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
        if (value.length > 3) value = value.substring(0, 3);
        e.target.value = value;
        
        // Validate
        validateCVC();
      });

      // Validation Functions
      function validateCardNumber() {
        const value = cardNumberInput.value.replace(/\s/g, '');
        const isValid = value.length === 16 && /^\d{16}$/.test(value);
        
        if (isValid) {
          cardNumberInput.classList.remove('is-invalid');
          cardNumberInput.classList.add('is-valid');
          document.getElementById('cardNumberError').classList.add('d-none');
        } else {
          cardNumberInput.classList.remove('is-valid');
          cardNumberInput.classList.add('is-invalid');
          document.getElementById('cardNumberError').classList.remove('d-none');
        }
        return isValid;
      }

      function validateExpiryDate() {
        const value = expiryInput.value;
        const regex = /^(0[1-9]|1[0-2])\/\d{2}$/;
        const isValid = regex.test(value);
        
        if (isValid) {
          // Additional validation for actual date
          const [month, year] = value.split('/');
          const currentDate = new Date();
          const currentYear = currentDate.getFullYear() % 100;
          const currentMonth = currentDate.getMonth() + 1;
          
          const isValidDate = parseInt(year) > currentYear || 
                            (parseInt(year) === currentYear && parseInt(month) >= currentMonth);
          
          if (isValidDate) {
            expiryInput.classList.remove('is-invalid');
            expiryInput.classList.add('is-valid');
            document.getElementById('expiryError').classList.add('d-none');
            return true;
          }
        }
        
        expiryInput.classList.remove('is-valid');
        expiryInput.classList.add('is-invalid');
        document.getElementById('expiryError').classList.remove('d-none');
        return false;
      }

      function validateCVC() {
        const value = cvcInput.value;
        const isValid = /^\d{3}$/.test(value);
        
        if (isValid) {
          cvcInput.classList.remove('is-invalid');
          cvcInput.classList.add('is-valid');
          document.getElementById('cvcError').classList.add('d-none');
        } else {
          cvcInput.classList.remove('is-valid');
          cvcInput.classList.add('is-invalid');
          document.getElementById('cvcError').classList.remove('d-none');
        }
        return isValid;
      }

      // Form Submission Validation
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const isCardValid = validateCardNumber();
        const isExpiryValid = validateExpiryDate();
        const isCVCValid = validateCVC();
        
        if (isCardValid && isExpiryValid && isCVCValid) {
          // All validations passed, submit the form
          form.submit();
        } else {
          // Show error messages
          if (!isCardValid) {
            document.getElementById('cardNumberError').textContent = 'Please enter a valid 16-digit card number';
          }
          if (!isExpiryValid) {
            document.getElementById('expiryError').textContent = 'Please enter a valid expiry date (MM/YY)';
          }
          if (!isCVCValid) {
            document.getElementById('cvcError').textContent = 'Please enter a valid 3-digit CVC';
          }
        }
      });

      // Real-time validation on blur
      cardNumberInput.addEventListener('blur', validateCardNumber);
      expiryInput.addEventListener('blur', validateExpiryDate);
      cvcInput.addEventListener('blur', validateCVC);
    });
  </script>
</body>
</html>
