<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Choose a Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
</head>
<body class="container py-5">
  <h2 class="mb-4">Choose your subscription</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" th:each="p : ${plans}">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title" th:text="${p.name}">Basic</h5>
          <h3 class="card-text" th:text="${p.price}">$5/mo</h3>
          <p class="text-muted mt-2" th:text="${p.features}">Features</p>
          <a class="btn btn-primary mt-auto" th:href="@{'/subscriptions/demo-payment'(plan=${p.code})}">Pay</a>
        </div>
      </div>
    </div>
  </div>
  <div class="mt-4">
    <a class="btn btn-outline-secondary" href="/subscriptions">Back to My Subscriptions</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
