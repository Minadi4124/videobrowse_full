<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Subscriptions & Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <style>
    .creator-name{ color:#ffffff !important; font-weight:600; }
    .plan-badge{ background: linear-gradient(135deg, #6848ff, #00e5ff); color:#fff; padding:6px 12px; border-radius:12px; font-weight:600; }
    .price-badge{ background: rgba(255,255,255,0.15); color:#fff; padding:6px 12px; border-radius:12px; font-weight:600; border:1px solid rgba(255,255,255,0.3); }
    .bar-header{ background: rgba(0,0,0,0.6); color:#fff; }
    .creator-input{ color:#ffffff !important; background-color:#212529 !important; border-color:#495057 !important; }
    .creator-input::placeholder{ color:#ffffff !important; opacity:0.8; }
  </style>
</head>
<body class="container mt-4">
<div class="d-flex align-items-center mb-3">
  <h3 class="mb-0">Subscriptions</h3>
  <a href="/" class="btn btn-outline-secondary btn-sm ms-auto">Back Home</a>
  <a href="/subscriptions/plans" class="btn btn-primary btn-sm ms-2">View Plans</a>
  </div>
<form class="d-flex mb-3" method="post" th:action="@{/subscriptions}">
  <input class="form-control creator-input" name="creatorName" placeholder="Creator name" required/>
  <select class="form-select ms-2" name="code" style="width: 150px;">
    <option value="basic">Basic (Rs. 3000)</option>
    <option value="standard">Standard (Rs. 5000)</option>
    <option value="premium">Premium (Rs. 10000)</option>
  </select>
  <button class="btn btn-primary ms-2">Subscribe</button>
  </form>
<table class="table table-bordered">
  <thead class="bar-header"><tr><th>Creator</th><th>Plan</th><th>Price</th><th>Actions</th></tr></thead>
  <tbody>
  <tr th:each="s : ${subs}">
    <td class="creator-name" th:text="${s.creatorName}"></td>
    <td><span class="plan-badge" th:text="${s.code} ?: 'basic'"></span></td>
    <td><span class="price-badge" th:text="${s.price} ?: 'Rs. 3000'"></span></td>
    <td>
      <form class="d-inline" method="post" th:action="@{/subscriptions/unsubscribe}">
        <input type="hidden" name="creatorName" th:value="${s.creatorName}"/>
        <button class="btn btn-sm btn-danger">Unsubscribe</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

<h3 class="mt-4">Notification Settings</h3>
<form method="post" th:action="@{/subscriptions/prefs}">
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="email" th:checked="${prefs != null and prefs.emailEnabled}"/>
    <label class="form-check-label">Email alerts</label>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="inapp" th:checked="${prefs == null or prefs.inAppEnabled}"/>
    <label class="form-check-label">In-app alerts</label>
  </div>
  <button class="btn btn-primary mt-2">Save</button>
  </form>

<h3 class="mt-4">Alerts</h3>
<div class="list-group">
  <div class="list-group-item d-flex justify-content-between align-items-center" th:each="a : ${alerts}">
    <div>
      <span th:text="${a.message}"></span>
      <small class="text-muted ms-2" th:text="${#temporals.format(a.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
    </div>
    <form method="post" th:action="@{'/subscriptions/alerts/' + ${a.id} + '/read'}" th:if="${!a.readFlag}">
      <button class="btn btn-sm btn-outline-secondary">Mark read</button>
    </form>
  </div>
</div>

</body>
</html>
