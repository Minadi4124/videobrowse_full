<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>SLIIT VMS - Edit Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(180deg, #0a0f1f, #0d1228) !important;
      min-height: 100vh;
      color: #ffffff !important;
    }
    
    .edit-container {
      background: radial-gradient(1000px 400px at 0 -20%,rgba(0,229,255,.08),transparent),
                  radial-gradient(1000px 400px at 100% 120%,rgba(122,92,255,.08),transparent),
                  rgba(20,27,45,.85);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .form-control, .form-select {
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
      background-color: #1a1a2e;
      color: #ffffff;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: rgba(0, 229, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
      background-color: #1a1a2e;
      color: #ffffff;
    }
    
    .btn-custom {
      border-radius: 25px;
      font-weight: 600;
      padding: 12px 30px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    
    .thumbnail-preview {
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      background: linear-gradient(135deg, rgba(104, 72, 255, 0.1), rgba(0, 229, 255, 0.1));
    }
    
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }
    
    .file-input-label {
      display: block;
      padding: 15px;
      background: linear-gradient(135deg, #6848ff, #00e5ff);
      color: white;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .file-input-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(104, 72, 255, 0.3);
    }
    
    .section-title {
      color: #6848ff;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
    }
    
    .required::after {
      content: " *";
      color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="edit-container p-5">
          <!-- Header -->
          <div class="d-flex align-items-center mb-4">
            <h2 class="mb-0 section-title">
              <i class="bi bi-pencil-square"></i>
              Edit Video
            </h2>
            <a href="/" class="btn btn-outline-secondary ms-auto">Back to Home</a>
          </div>
          
          <form th:action="@{'/videos/' + ${video.id} + '/edit'}" method="post" enctype="multipart/form-data">
            
            <!-- Video Information Section -->
            <div class="mb-4">
              <h5 class="section-title">
                <i class="bi bi-info-circle"></i>
                Video Information
              </h5>
              
              <div class="row">
                <div class="col-md-8">
                  <div class="mb-3">
                    <label class="form-label required">Title</label>
                    <input class="form-control" name="title" th:value="${video.title}" required/>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="mb-3">
                    <label class="form-label">Visibility</label>
                    <select class="form-select" name="visibility">
                      <option value="PUBLIC" th:selected="${video.visibility?.name() == 'PUBLIC'}">Public</option>
                      <option value="UNLISTED" th:selected="${video.visibility?.name() == 'UNLISTED'}">Unlisted</option>
                      <option value="PRIVATE" th:selected="${video.visibility?.name() == 'PRIVATE'}">Private</option>
                    </select>
                  </div>
                </div>
              </div>
              
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="4" th:text="${video.description}"></textarea>
              </div>
              
              <div class="row">
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" name="category" th:value="${video.category}"/>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="mb-3">
                    <label class="form-label">Tags</label>
                    <input class="form-control" name="tags" th:value="${video.tags}" placeholder="Separate tags with commas"/>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Thumbnail Section -->
            <div class="mb-4">
              <h5 class="section-title">
                <i class="bi bi-image"></i>
                Thumbnail
              </h5>
              
              <div class="row">
                <div class="col-md-4">
                  <div class="thumbnail-preview mb-3">
                    <img th:if="${video.thumbnail}" th:src="@{'/files/thumbs/' + ${video.thumbnail}}" 
                         class="img-fluid" alt="Current thumbnail" style="width: 100%; height: 150px; object-fit: cover;"/>
                    <div th:unless="${video.thumbnail}" class="d-flex align-items-center justify-content-center" 
                         style="height: 150px; background: linear-gradient(135deg, #f8f9fa, #e9ecef);">
                      <i class="bi bi-image text-muted" style="font-size: 2rem;"></i>
                    </div>
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="mb-3">
                    <label class="form-label">Upload New Thumbnail</label>
                    <div class="file-input-wrapper">
                      <input type="file" name="thumbnail" accept="image/*" id="thumbnailInput"/>
                      <label for="thumbnailInput" class="file-input-label">
                        <i class="bi bi-upload me-2"></i>
                        Choose Thumbnail Image
                      </label>
                    </div>
                    <div class="form-text">
                      <i class="bi bi-info-circle me-1"></i>
                      Recommended: 1280x720 pixels, JPG or PNG format
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="d-flex gap-3">
              <button class="btn btn-primary btn-custom" type="submit">
                <i class="bi bi-check-circle me-2"></i>
                Save Changes
              </button>
              <a th:href="@{'/videos/' + ${video.id}}" class="btn btn-outline-secondary btn-custom">
                <i class="bi bi-eye me-2"></i>
                View Video
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Preview thumbnail before upload
    document.getElementById('thumbnailInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.querySelector('.thumbnail-preview img');
          if (preview) {
            preview.src = e.target.result;
          } else {
            const newImg = document.createElement('img');
            newImg.src = e.target.result;
            newImg.className = 'img-fluid';
            newImg.style = 'width: 100%; height: 150px; object-fit: cover;';
            newImg.alt = 'Thumbnail preview';
            document.querySelector('.thumbnail-preview').innerHTML = '';
            document.querySelector('.thumbnail-preview').appendChild(newImg);
          }
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
