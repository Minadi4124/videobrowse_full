<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>My Support Tickets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="/css/theme.css" rel="stylesheet"/></head>
<body class="container mt-4">
  <div class="d-flex align-items-center mb-3">
    <h3 class="mb-0">My Support Tickets</h3>
    <a href="/support/new" class="btn btn-sm btn-primary ms-auto">New Ticket</a>
    <a href="/" class="btn btn-sm btn-outline-secondary ms-2">Home</a>
  </div>

  <div th:if="${#lists.isEmpty(tickets)}" class="alert alert-info">You have not submitted any support tickets yet.</div>

  <div th:each="t : ${tickets}" class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-start">
        <div class="flex-grow-1">
          <h5 class="card-title mb-1">Ticket #<span th:text="${t.id}">1</span> <span class="badge bg-secondary ms-2" th:text="${t.status}">OPEN</span></h5>
          <div class="text-muted small mb-2" th:text="${t.createdAt}">2025-01-01</div>
          <p class="mb-2" th:text="${t.message}">Message</p>
          <ul class="small text-muted mb-0" th:if="${t.notes}">
            <li th:each="n : ${t.notes}" th:text="${n.note}"></li>
          </ul>
        </div>
        <div class="ms-3 text-nowrap">
          <a th:href="@{'/support/' + ${t.id} + '/edit'}" class="btn btn-sm btn-outline-primary">Edit</a>
          <form th:action="@{'/support/' + ${t.id} + '/delete'}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this ticket?')">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
