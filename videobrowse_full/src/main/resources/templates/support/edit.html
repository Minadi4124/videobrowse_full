<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>Edit Support Ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="/css/theme.css" rel="stylesheet"/></head>
<body class="container mt-4" style="max-width:720px;">
  <div class="d-flex align-items-center mb-3">
    <h3 class="mb-0">Edit Ticket #<span th:text="${ticket.id}">1</span></h3>
    <a href="/support/my" class="btn btn-sm btn-outline-secondary ms-auto">Back</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:action="@{'/support/' + ${ticket.id} + '/edit'}" method="post">
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" class="form-control" rows="6" th:text="${ticket.message}"></textarea>
        </div>
        <button class="btn btn-primary">Save Changes</button>
        <a href="/support/my" class="btn btn-outline-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
