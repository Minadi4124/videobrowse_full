<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>Support Tickets - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="/css/theme.css" rel="stylesheet"/></head>
<body class="container mt-4">
  <div class="d-flex align-items-center mb-3">
    <h3 class="mb-0">Support Tickets</h3>
    <a href="/" class="btn btn-sm btn-outline-secondary ms-auto">Back to Home</a>
  </div>
  
  <div class="alert alert-info">
    <strong>Admin Panel:</strong> Manage support tickets from users. You can update status, add notes, and delete tickets.
  </div>
  
  <table class="table table-striped">
    <thead><tr><th>ID</th><th>User</th><th>Email</th><th>Status</th><th>Message</th><th>Notes</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="t : ${tickets}">
        <td th:text="${t.id}">1</td>
        <td th:text="${t.username}">user</td>
        <td th:text="${t.email}">email</td>
        <td th:text="${t.status}">OPEN</td>
        <td th:text="${t.message}">msg</td>
        <td>
          <ul class="small mb-2">
            <li th:each="n : ${t.notes}" th:text="${n.note}"></li>
          </ul>
          <form th:action="@{'/support/' + ${t.id} + '/note'}" method="post" class="d-flex">
            <input class="form-control form-control-sm" name="note" placeholder="Add note"/>
            <button class="btn btn-sm btn-outline-secondary ms-1">Add</button>
          </form>
        </td>
        <td>
          <form th:action="@{'/support/' + ${t.id} + '/status'}" method="post" class="d-inline">
            <select name="status" class="form-select form-select-sm d-inline w-auto">
              <option>OPEN</option><option>IN_PROGRESS</option><option>RESOLVED</option><option>CLOSED</option>
            </select>
            <button class="btn btn-sm btn-primary ms-1">Update</button>
          </form>
          <form th:action="@{'/support/' + ${t.id} + '/delete'}" method="post" class="d-inline">
            <button class="btn btn-sm btn-danger ms-1" onclick="return confirm('Are you sure you want to delete this ticket?')">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
