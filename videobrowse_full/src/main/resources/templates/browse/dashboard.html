<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Browse Videos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    @media (max-width: 576px) { .saved-list { font-size: 14px; } }
    
    /* Video card styling (same as home page) */
    .uv-card{width:100%;height:min-content;transition:all .3s;position:relative;border-radius:.5rem 2rem;box-shadow:0 15px 20px -5px rgba(0,0,0,.5);background:transparent;border:0}
    .uv-card:hover{transform:scale(1.03)}
    .uv-img{transition:all .3s;width:100%;height:100%;object-fit:cover}
    .uv-img-container{display:grid;border-radius:.5rem 2rem;height:270px;overflow:hidden;background:linear-gradient(135deg, rgba(0,229,255,.35), rgba(122,92,255,.35))}
    .uv-img:hover{transform:scale(1.15)}
    .uv-desc{position:absolute;bottom:.5rem;left:.5rem;text-align:start;padding:.5rem 1rem;width:90%;transition:all .5s ease;text-overflow:ellipsis;white-space:nowrap;backdrop-filter:blur(.1rem);background-color:rgba(0,229,255,.18);border-radius:.5rem 2rem}
    .uv-desc:hover{transform:perspective(100px) translateX(7px) rotateX(3deg) rotateY(3deg) scale(1)}
    .uv-title{color:#ffffff;margin:0;font-weight:600}
    .form-control::placeholder{color:#ffffff !important}
  </style>
  </head>
<body class="container mt-4">
  <!-- Header with navigation -->
  <div class="d-flex align-items-center mb-4">
    <h2 class="mb-0 text-primary">Browse Videos</h2>
    <a href="/" class="btn btn-outline-secondary ms-auto">Back to Home</a>
  </div>

  <!-- Search form -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">Search & Filter</h5>
      <form class="row g-2" th:action="@{/browse/search}">
        <div class="col-sm">
          <input class="form-control" name="q" placeholder="Search videos..." th:value="${q}"/>
        </div>
        <div class="col-sm">
          <input class="form-control" name="category" placeholder="Category filter" th:value="${category}"/>
        </div>
        <div class="col-sm">
          <select class="form-select" name="sort">
            <option value="uploadedAtDesc">Newest First</option>
            <option value="uploadedAtAsc">Oldest First</option>
            <option value="titleAsc">Title A-Z</option>
            <option value="titleDesc">Title Z-A</option>
          </select>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary">Search</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Videos Section -->
  <div class="mb-4">
    <div class="d-flex align-items-center mb-3">
      <h4 class="mb-0">All Videos</h4>
      <span class="badge bg-primary ms-2" th:text="${#lists.size(videos)}">0</span>
    </div>
    
    <!-- No videos message -->
    <div class="row" th:if="${#lists.isEmpty(videos)}">
      <div class="col-12">
        <div class="alert alert-info text-center">
          <h5>No videos available</h5>
          <p class="mb-0">Be the first to upload a video!</p>
          <a href="/videos/upload" class="btn btn-primary mt-2">Upload Video</a>
        </div>
      </div>
    </div>

    <!-- Videos grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3" th:if="${!#lists.isEmpty(videos)}">
      <div class="col" th:each="video: ${videos}">
        <a th:href="@{'/videos/' + ${video.id}}" class="text-decoration-none">
          <div class="uv-card mb-3">
            <div class="uv-img-container">
              <img class="uv-img" th:if="${video.thumbnail}" th:src="@{'/files/thumbs/' + ${video.thumbnail}}" alt="thumb"/>
              <div th:unless="${video.thumbnail}" class="d-flex align-items-center justify-content-center h-100 text-white">
                <i class="bi bi-play-circle" style="font-size: 3rem;"></i>
              </div>
            </div>
            <div class="uv-desc">
              <h6 class="uv-title" th:text="${video.title}">Title</h6>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- Saved Searches Section -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Saved Searches</h5>
      <div class="saved-list">
        <div th:if="${saved == null || #lists.isEmpty(saved)}" class="text-muted">No saved searches.</div>
        <ul class="list-group" th:if="${saved != null && !#lists.isEmpty(saved)}">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="s : ${saved}">
            <span>
              <a th:href="@{'/browse/search?q=' + ${s.query} + '&category=' + ${s.category} + '&sort=' + ${s.sort}}" th:text="${s.query} ?: 'All'">q</a>
              <small class="text-muted ms-2" th:text="${s.category}"></small>
            </span>
            <form th:action="@{'/browse/saved/' + ${s.id} + '/delete'}" method="post">
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
