<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/theme.css" rel="stylesheet"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    @media (max-width: 576px) { .result-card { margin-bottom: 12px; } }
    .form-control::placeholder{color:#ffffff !important}
  </style>
</head>
<body class="container mt-3">
<form class="row g-2" th:action="@{/browse/search}">
  <div class="col-12 col-md"><input class="form-control" name="q" th:value="${q}" placeholder="Search..."/></div>
  <div class="col-6 col-md"><input class="form-control" name="category" th:value="${category}" placeholder="Category"/></div>
  <div class="col-6 col-md">
    <select class="form-select" name="sort" th:value="${sort}">
      <option value="uploadedAtDesc">Newest</option>
      <option value="uploadedAtAsc">Oldest</option>
      <option value="titleAsc">Title A-Z</option>
      <option value="titleDesc">Title Z-A</option>
    </select>
  </div>
  <div class="col-auto"><button class="btn btn-primary">Search</button></div>
  <div class="col-auto">
    <form method="post" th:action="@{/browse/save}">
      <input type="hidden" name="q" th:value="${q}"/>
      <input type="hidden" name="category" th:value="${category}"/>
      <input type="hidden" name="sort" th:value="${sort}"/>
      <button class="btn btn-outline-secondary">Save</button>
    </form>
  </div>
</form>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 mt-2">
  <div class="col" th:each="v : ${videos}">
    <div class="card result-card h-100">
      <div class="card-body">
        <h5 class="card-title" th:text="${v.title}">Title</h5>
        <p class="card-text" th:text="${v.description}">Desc</p>
        <div class="d-flex justify-content-between">
          <small class="text-muted" th:text="${v.category}">cat</small>
          <a th:href="@{'/videos/' + ${v.id}}" class="btn btn-sm btn-primary">View</a>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
