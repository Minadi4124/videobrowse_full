<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Tag Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h3>Tags</h3>
<form class="d-flex" method="post" th:action="@{/admin/tags}">
  <input class="form-control" name="name" placeholder="Tag name" required/>
  <button class="btn btn-primary ms-2">Add</button>
</form>

<table class="table table-bordered mt-3">
  <thead>
  <tr><th>ID</th><th>Name</th><th>Actions</th></tr>
  </thead>
  <tbody>
  <tr th:each="t : ${items}">
    <td th:text="${t.id}"></td>
    <td>
      <form class="d-flex" th:action="@{'/admin/tags/' + ${t.id} + '/rename'}" method="post">
        <input class="form-control" name="name" th:value="${t.name}"/>
        <button class="btn btn-sm btn-primary ms-2">Save</button>
      </form>
    </td>
    <td>
      <form th:action="@{'/admin/tags/' + ${t.id} + '/delete'}" method="post" class="d-inline">
        <button class="btn btn-sm btn-danger">Delete</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>

</body>
</html>
