<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Classify Video</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h3 th:text="${video.title}">Video</h3>

<form th:action="@{'/admin/videos/' + ${video.id} + '/classify'}" method="post">
  <div class="mb-3">
    <label class="form-label">Category</label>
    <select class="form-select" name="categoryId">
      <option th:selected="${video.categoryRef == null}" value="">-- None --</option>
      <option th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
              th:selected="${video.categoryRef != null and video.categoryRef.id == c.id}">
      </option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Tags</label>
    <div class="row row-cols-2">
      <div class="col" th:each="t : ${tags}">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="tagIds" th:value="${t.id}"
                 th:checked="${video.tagRefs.contains(t)}"/>
          <label class="form-check-label" th:text="${t.name}"></label>
        </div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" type="submit">Save</button>
  <a class="btn btn-secondary ms-2" href="/admin/dashboard">Cancel</a>
</form>

</body>
</html>
